name: Patch Panel Formulas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-panel-formulas.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index("async function updateDependentCaches")
          end=s.index("function renderDetails", start)
          replacement=base64.b64decode(" sLGJ5U2l6ZS5nZXQobm9ybVRleHQobGFiZWwpKXx8MCl9KTsKICBmb3IobGV0IHJuPTExO3JuPD05OTtybisrKXsKICAgY29uc3QgaXRlbT1za3VMaXN0W3JuLTExXSxnPWBJRkVSUk9S KElOREVYKFByaW9yaWRhZGUhJEEkMjokQSQxMDAsTUFUQ0goUk9XKCktMTAsUHJpb3JpZGFkZSEkRiQyOiRGJDEwMCwwKSksIiIpYCxoPWBJRihHJHtybn09IiIsIiIsSUZFUlJPUihJTkRFWChQcmlvcmlkYWRlISR CJDIkOkIkMTAwLE1BVENIKEcke3JufSxQcmlvcmlkYWRlISR BJDIkOkEkMTAwLDApKSwiIikpYCxpPWBJRihHJHtybn09IiIsIiIsSUZFUlJPUihJTkRFWChDYWRhc3RybyEkQyQyOiRDJDEwMDAsTUFUQ0goRyR7cm59LENhZGFzdHJvISR  ").decode("utf-8")
          s=s[:start]+replacement+s[end:]
          s=s.replace("v1.2.10","v1.2.11")
          assert 'const APP_VERSION="v1.2.11"' in s
          assert 'const CURRENT_VERSION="v1.2.11"' in s
          assert 'SUM(Estoque!$J$4:$J$2075)' in s
          assert 'MATCH(ROW()-10,Prioridade!$F$2:$F$100,0)' in s
          p.write_text(s,encoding="utf-8")
          Path("version.json").write_text('{"version":"v1.2.11"}\n',encoding="utf-8")
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()&&!s.includes('src='));
          scripts.forEach((s,i)=>{ try{ new Function(s); }catch(e){ console.error("Script",i+1,e); process.exit(1); } });
          if(!html.includes("v1.2.11")) process.exit(1);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-panel-formulas.yml
          git config user.name "marinamartinsquimica-beep"
          git config user.email "marinamartinsquimica@gmail.com"
          git add -A
          git commit -m "fix: painel acompanha estoque por fórmulas v1.2.11"
          git push origin main
