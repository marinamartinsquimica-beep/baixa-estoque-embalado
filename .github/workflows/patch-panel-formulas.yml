name: Patch Panel Formulas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-panel-formulas.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          helper=r'''async function installPanelFormulas(xlsx){
 const painel=await xlsx.sheetByName("Painel");if(!painel)return;
 const put=(ref,formula,type="number")=>{const m=ref.match(/^([A-Z]+)(\d+)$/),rn=Number(m[2]),row=rowByNumber(xlsx,painel.doc,rn);if(!row)return;const col=m[1],cell=xlsx.ensureCell(row,col,rn),cached=xlsx.value(cell);if(type==="string")xlsx.setString(cell,cached??"",formula);else xlsx.setNumber(cell,Number(cached)||0,formula)};
 put("B5",'SUM(Estoque!$J$4:$J$2075)');
 put("F5",'SUM(Estoque!$K$4:$K$2075)');
 put("J5",'COUNTIF(Prioridade!$E$2:$E$100,">0")');
 for(let rn=11;rn<=14;rn++)put("C"+rn,`SUMIF(Estoque!$C$4:$C$2075,B${rn},Estoque!$K$4:$K$2075)`);
 for(let rn=11;rn<=99;rn++){
  const g=`IFERROR(INDEX(Prioridade!$A$2:$A$100,MATCH(ROW()-10,Prioridade!$F$2:$F$100,0)),"")`,h=`IF(G${rn}="","",IFERROR(INDEX(Prioridade!$B$2:$B$100,MATCH(G${rn},Prioridade!$A$2:$A$100,0)),""))`,i=`IF(G${rn}="","",IFERROR(INDEX(Cadastro!$C$2:$C$1000,MATCH(G${rn},Cadastro!$A$2:$A$1000,0)),""))`,j=`IF(G${rn}="","",SUMIF(Estoque!$A$4:$A$2075,G${rn},Estoque!$J$4:$J$2075))`,k=`IF(G${rn}="","",SUMIF(Estoque!$A$4:$A$2075,G${rn},Estoque!$K$4:$K$2075))`;
  const row=rowByNumber(xlsx,painel.doc,rn),hasSku=row&&normSku(xlsx.value(xlsx.findCell(row,"G")));
  put("G"+rn,g,hasSku?"number":"string");put("H"+rn,h,"string");put("I"+rn,i,"string");put("J"+rn,j,hasSku?"number":"string");put("K"+rn,k,hasSku?"number":"string")
 }
 await xlsx.saveSheet(painel)
}
'''
          if "async function installPanelFormulas" not in s:
              marker="function renderDetails"
              s=s.replace(marker,helper+marker,1)
          s=s.replace("await updateDependentCaches(sx,rew.finalRecords);await sx.forceRecalc();","await updateDependentCaches(sx,rew.finalRecords);await installPanelFormulas(sx);await sx.forceRecalc();")
          s=s.replace("v1.2.10","v1.2.11")
          assert s.count("await installPanelFormulas(sx);")==2
          assert 'const APP_VERSION="v1.2.11"' in s
          assert 'const CURRENT_VERSION="v1.2.11"' in s
          assert 'SUM(Estoque!$J$4:$J$2075)' in s
          assert 'MATCH(ROW()-10,Prioridade!$F$2:$F$100,0)' in s
          p.write_text(s,encoding="utf-8")
          Path("version.json").write_text('{"version":"v1.2.11"}\n',encoding="utf-8")
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach((s,i)=>{ try{ new Function(s); }catch(e){ console.error("Script",i+1,e); process.exit(1); } });
          if(!html.includes("v1.2.11")) process.exit(1);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-panel-formulas.yml
          git config user.name "marinamartinsquimica-beep"
          git config user.email "marinamartinsquimica@gmail.com"
          git add -A
          git commit -m "fix: painel acompanha estoque por fórmulas v1.2.11"
          git push origin main
