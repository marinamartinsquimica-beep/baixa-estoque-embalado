<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Baixa de Estoque Embalado</title>
<style>
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#285674;display:grid;place-items:center;min-height:100vh}
.loading{text-align:center;font-weight:700}.loading small{display:block;margin-top:8px;font-weight:400;color:#7a8a96}
</style>
</head>
<body>
<div class="loading">Carregando Sala de ovos - Baixa Estoque v1.0.13<small>Aguarde alguns segundos...</small></div>
<script>
(async()=>{
  const APP_URL='https://raw.githubusercontent.com/marinamartinsquimica-beep/baixa-estoque-embalado/ec1e2d92df34dcb18ea04a425b7f6003cd14d37d/index.html';
  const LOGO_SOURCE='https://raw.githubusercontent.com/aia-raiar/raiar/main/suporte_paripassu/index.html';
  try{
    const [appResp,logoResp]=await Promise.all([fetch(APP_URL,{cache:'no-store'}),fetch(LOGO_SOURCE,{cache:'force-cache'})]);
    if(!appResp.ok) throw new Error('Não foi possível carregar a aplicação base.');
    let app=await appResp.text();
    let logo='';
    if(logoResp.ok){
      const ref=await logoResp.text();
      const m=ref.match(/<img[^>]+src="(data:image\/[^\"]+)"[^>]*>/i);
      if(m) logo=m[1];
    }
    if(logo){
      app=app.replace(/<svg class="hero-logo"[\s\S]*?<\/svg>/i,`<img class="hero-logo" src="${logo}" alt="Raiar Orgânicos">`);
      app=app.replace('</style>','.hero-logo{mix-blend-mode:screen!important;filter:none!important;background:transparent!important;object-fit:contain!important}</style>');
    }
    app=app.replaceAll('v1.0.12','v1.0.13');
    app=app.replaceAll('ESTOQUE_EMBALADO_ATUALIZADO_v1.0.12_','ESTOQUE_EMBALADO_ATUALIZADO_v1.0.13_');
    document.open();
    document.write(app);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">Erro ao carregar o sistema<small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
